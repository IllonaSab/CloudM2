name: Front Build, Push & Deploy

on:
  push:
    branches:
      - main
    paths:
      - "src/front/**"

env:
  IMAGE_NAME: cloudm2-front

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./src/front
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_FRONTAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest